[project]
name = "code-review-agent"
version = "0.1.0"
description = "Comparative code-review agent harness — Anthropic Client SDK vs Claude Agent SDK."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.0.10",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Phase 4 — sandbox layer. Used by sandbox/daytona.py when
    # SANDBOX_BACKEND=daytona; LocalRepo doesn't import it.
    # Floor of 0.171.0 because that's the version we tested against
    # and `CreateSandboxFromImageParams` requires it. (CR suggested
    # <0.2.0 on PR #23, but Daytona's version scheme jumps 0.1.0 →
    # 0.17.0 → 0.171.0; <0.2.0 actually capped at 0.1.0 and broke
    # the import. Floor-pin instead.) Bump explicitly when the SDK
    # ships a new version we want.
    "daytona>=0.171.0",
    # Phase 4 — Repo conformance tests under tests/.
    "pytest>=8.0.0",
    # Phase 6 — learnings vector DB. qdrant-client talks to Qdrant Cloud
    # (see QDRANT_URL, QDRANT_API_KEY in .env). voyageai is the embedding
    # model client (voyage-code-3, 1024d).
    "qdrant-client>=1.10.0",
    "voyageai>=0.2.3",
]

[tool.uv]
package = false  # this is an application, not an installable package

[tool.pytest.ini_options]
# Phase 5 — needed because `package = false` means imports like
# `from github.pr_fetch import ...` don't resolve without explicit pythonpath.
asyncio_mode = "strict"
pythonpath = ["."]
# Phase 4 — only collect our own tests. tests/fixtures/ contains vendored
# Sentry source trees (the planted-bug fixtures) that include their own
# upstream test files; pytest would try to import those and fail on
# missing pytest plugins / missing imports.
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
python_files = ["test_*.py"]
