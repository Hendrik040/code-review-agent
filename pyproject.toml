[project]
name = "tool-offload-compare"
version = "0.1.0"
description = "Compare tool-output handling between Claude Agent SDK and the Anthropic client SDK."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.0.10",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["compare"]
